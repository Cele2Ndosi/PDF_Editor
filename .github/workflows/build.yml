name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Fast sanity check in a Linux container: syntax + dependency import.
  # This is what the Dockerfile is for in CI — a consistent, reproducible
  # environment for testing, not for producing the .exe.
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build -t pdf-editor:test .

      - name: Smoke test inside container
        run: |
          docker run --rm pdf-editor:test python -c "
          import ast, fitz, PIL
          ast.parse(open('pdf_editor.py').read())
          print('Syntax OK, dependencies import cleanly')
          "

  # The actual .exe is built here, on a real Windows machine, which is why
  # this job (not Docker) is the reliable source of the release artifact.
  build-windows-exe:
    needs: lint-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --clean --noconfirm pdf_editor.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF_Editor-windows-exe
          path: dist/PDF_Editor.exe
          if-no-files-found: error

  # Only runs when you push a tag like v1.0.0 — attaches the exe to a
  # GitHub Release automatically.
  release:
    needs: build-windows-exe
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PDF_Editor-windows-exe
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PDF_Editor.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
